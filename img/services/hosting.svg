<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Hosting și Domeniu">
    <defs>
        <linearGradient id="bgGrad8" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0c1426"/>
            <stop offset="100%" stop-color="#0a0a14"/>
        </linearGradient>
        <linearGradient id="serverGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1a1a2e"/>
            <stop offset="100%" stop-color="#0a0a14"/>
        </linearGradient>
        <filter id="glow8" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="400" height="300" fill="url(#bgGrad8)"/>
    <g opacity="0.06" stroke="#00f0ff" stroke-width="0.5">
        <line x1="0" y1="60" x2="400" y2="60"/>
        <line x1="0" y1="120" x2="400" y2="120"/>
        <line x1="0" y1="180" x2="400" y2="180"/>
        <line x1="0" y1="240" x2="400" y2="240"/>
    </g>

    <!-- Globe -->
    <g filter="url(#glow8)" transform="translate(80, 150)">
        <circle cx="0" cy="0" r="48" fill="#0a0a14" stroke="#00f0ff" stroke-width="1.5"/>
        <ellipse cx="0" cy="0" rx="48" ry="18" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.6"/>
        <ellipse cx="0" cy="0" rx="48" ry="34" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.4"/>
        <line x1="-48" y1="0" x2="48" y2="0" stroke="#00f0ff" stroke-width="0.5" opacity="0.6"/>
        <line x1="0" y1="-48" x2="0" y2="48" stroke="#00f0ff" stroke-width="0.5" opacity="0.6"/>
        <ellipse cx="0" cy="0" rx="22" ry="48" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.6"/>

        <!-- Continents (abstract) -->
        <path d="M -28 -16 Q -20 -22 -10 -18 Q -8 -10 -16 -6 Q -22 -2 -28 -8 Z" fill="#00f0ff" opacity="0.4"/>
        <path d="M 4 -8 Q 18 -12 22 -4 Q 20 8 12 12 Q 4 8 4 0 Z" fill="#00f0ff" opacity="0.4"/>
        <path d="M -14 12 Q -4 8 4 14 Q 0 22 -8 24 Q -16 20 -14 12 Z" fill="#00f0ff" opacity="0.4"/>

        <!-- Connection points -->
        <circle cx="-18" cy="-12" r="2" fill="#ff073a"/>
        <circle cx="14" cy="4" r="2" fill="#ff073a"/>
        <circle cx="-6" cy="20" r="2" fill="#ff073a"/>
    </g>

    <!-- Server stack (right) -->
    <g filter="url(#glow8)">
        <rect x="180" y="60" width="170" height="36" rx="3" fill="url(#serverGrad)" stroke="#00f0ff" stroke-width="1.5"/>
        <circle cx="195" cy="78" r="3" fill="#00ff9d"/>
        <line x1="208" y1="78" x2="270" y2="78" stroke="#00f0ff" stroke-width="1" opacity="0.7"/>
        <rect x="280" y="72" width="50" height="12" rx="1" fill="#00f0ff" opacity="0.2"/>
        <line x1="285" y1="78" x2="320" y2="78" stroke="#00f0ff" stroke-width="1"/>

        <rect x="180" y="100" width="170" height="36" rx="3" fill="url(#serverGrad)" stroke="#00f0ff" stroke-width="1.5"/>
        <circle cx="195" cy="118" r="3" fill="#00ff9d"/>
        <line x1="208" y1="118" x2="270" y2="118" stroke="#00f0ff" stroke-width="1" opacity="0.7"/>
        <rect x="280" y="112" width="50" height="12" rx="1" fill="#00f0ff" opacity="0.2"/>
        <line x1="285" y1="118" x2="325" y2="118" stroke="#00f0ff" stroke-width="1"/>

        <rect x="180" y="140" width="170" height="36" rx="3" fill="url(#serverGrad)" stroke="#00f0ff" stroke-width="1.5"/>
        <circle cx="195" cy="158" r="3" fill="#00ff9d"/>
        <line x1="208" y1="158" x2="270" y2="158" stroke="#00f0ff" stroke-width="1" opacity="0.7"/>
        <rect x="280" y="152" width="50" height="12" rx="1" fill="#00f0ff" opacity="0.2"/>
        <line x1="285" y1="158" x2="318" y2="158" stroke="#00f0ff" stroke-width="1"/>

        <rect x="180" y="180" width="170" height="36" rx="3" fill="url(#serverGrad)" stroke="#00f0ff" stroke-width="1.5"/>
        <circle cx="195" cy="198" r="3" fill="#00ff9d"/>
        <line x1="208" y1="198" x2="270" y2="198" stroke="#00f0ff" stroke-width="1" opacity="0.7"/>
        <rect x="280" y="192" width="50" height="12" rx="1" fill="#00f0ff" opacity="0.2"/>
        <line x1="285" y1="198" x2="322" y2="198" stroke="#00f0ff" stroke-width="1"/>
    </g>

    <!-- Connection lines globe -> servers -->
    <g stroke="#00f0ff" stroke-width="1" fill="none" opacity="0.5" stroke-dasharray="3,2">
        <path d="M 130 138 Q 155 100 180 78"/>
        <path d="M 130 150 Q 155 150 180 118"/>
        <path d="M 130 162 Q 155 190 180 158"/>
        <path d="M 130 150 Q 155 224 180 198"/>
    </g>

    <!-- Domain URL pill -->
    <g filter="url(#glow8)">
        <rect x="60" y="234" width="280" height="36" rx="18" fill="#0a0a14" stroke="#00f0ff" stroke-width="2"/>
        <text x="200" y="257" font-family="JetBrains Mono, monospace" font-size="13" fill="#00f0ff" text-anchor="middle" font-weight="700">digital-online.ro</text>
    </g>

    <!-- Email icon floating -->
    <g filter="url(#glow8)" transform="translate(80, 80)">
        <rect x="-15" y="-10" width="30" height="20" rx="2" fill="#0a0a14" stroke="#00f0ff" stroke-width="1"/>
        <polyline points="-15,-10 0,2 15,-10" fill="none" stroke="#00f0ff" stroke-width="1"/>
    </g>

    <!-- Bottom label -->
    <text x="320" y="285" font-family="JetBrains Mono, monospace" font-size="8" fill="#00f0ff" opacity="0.7" font-weight="700" text-anchor="end">// HOSTING</text>
</svg>
