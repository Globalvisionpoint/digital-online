<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="SEO On-Page">
    <defs>
        <linearGradient id="bgGrad7" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0c1426"/>
            <stop offset="100%" stop-color="#0a0a14"/>
        </linearGradient>
        <filter id="glow7" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="400" height="300" fill="url(#bgGrad7)"/>
    <g opacity="0.06" stroke="#00f0ff" stroke-width="0.5">
        <line x1="0" y1="60" x2="400" y2="60"/>
        <line x1="0" y1="120" x2="400" y2="120"/>
        <line x1="0" y1="180" x2="400" y2="180"/>
        <line x1="0" y1="240" x2="400" y2="240"/>
    </g>

    <!-- Search bar -->
    <g filter="url(#glow7)">
        <rect x="60" y="50" width="280" height="40" rx="20" fill="#0a0a14" stroke="#00f0ff" stroke-width="2"/>
        <circle cx="83" cy="70" r="8" fill="none" stroke="#00f0ff" stroke-width="2"/>
        <line x1="89" y1="76" x2="95" y2="82" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="108" y="74" font-family="Inter, sans-serif" font-size="11" fill="#7dd3fc" opacity="0.7">digital online site</text>
        <line x1="200" y1="64" x2="200" y2="78" stroke="#00f0ff" stroke-width="1.5" opacity="0.9"/>
    </g>

    <!-- Google-style results header -->
    <g filter="url(#glow7)">
        <text x="60" y="115" font-family="Inter, sans-serif" font-size="9" fill="#7dd3fc" opacity="0.5">About 1,240,000 results in 0.32s</text>
        <line x1="60" y1="120" x2="340" y2="120" stroke="#00f0ff" stroke-width="0.5" opacity="0.2"/>
    </g>

    <!-- Result 1 - top -->
    <g filter="url(#glow7)">
        <g transform="translate(60, 130)">
            <circle cx="10" cy="10" r="9" fill="#00f0ff" opacity="0.2"/>
            <text x="10" y="14" font-family="Orbitron, sans-serif" font-size="10" fill="#00f0ff" text-anchor="middle" font-weight="900">D</text>
            <text x="28" y="12" font-family="Inter, sans-serif" font-size="9" fill="#00f0ff">digital-online.ro</text>
            <text x="28" y="22" font-family="Inter, sans-serif" font-size="11" fill="#7dd3fc" font-weight="700">Digital Online — Site-uri Web &amp; Servicii IT</text>
            <text x="0" y="36" font-family="Inter, sans-serif" font-size="8" fill="#7dd3fc" opacity="0.7">Agentie digitala cu 7+ ani experienta. Design, dezvoltare, mentenanta.</text>
            <rect x="-2" y="-4" width="270" height="46" fill="none" stroke="#00ff9d" stroke-width="1" stroke-dasharray="3,2" opacity="0.7"/>
            <text x="278" y="14" font-family="JetBrains Mono, monospace" font-size="9" fill="#00ff9d" font-weight="700">#1</text>
        </g>

        <!-- Result 2 -->
        <g transform="translate(60, 188)">
            <circle cx="10" cy="10" r="9" fill="#7dd3fc" opacity="0.15"/>
            <text x="10" y="14" font-family="Inter, sans-serif" font-size="10" fill="#7dd3fc" text-anchor="middle">C</text>
            <text x="28" y="12" font-family="Inter, sans-serif" font-size="9" fill="#7dd3fc" opacity="0.7">compete-site.ro</text>
            <text x="28" y="22" font-family="Inter, sans-serif" font-size="10" fill="#7dd3fc" opacity="0.7">Servicii web profesionale...</text>
        </g>

        <!-- Result 3 -->
        <g transform="translate(60, 224)">
            <circle cx="10" cy="10" r="9" fill="#7dd3fc" opacity="0.15"/>
            <text x="10" y="14" font-family="Inter, sans-serif" font-size="10" fill="#7dd3fc" text-anchor="middle">A</text>
            <text x="28" y="12" font-family="Inter, sans-serif" font-size="9" fill="#7dd3fc" opacity="0.7">alt-site.ro</text>
            <text x="28" y="22" font-family="Inter, sans-serif" font-size="10" fill="#7dd3fc" opacity="0.7">Creare site-uri web...</text>
        </g>
    </g>

    <!-- Tag pills -->
    <g filter="url(#glow7)">
        <rect x="60" y="262" width="50" height="18" rx="9" fill="#0a0a14" stroke="#00f0ff" stroke-width="1"/>
        <text x="85" y="274" font-family="JetBrains Mono, monospace" font-size="7" fill="#00f0ff" text-anchor="middle">SEO</text>

        <rect x="118" y="262" width="60" height="18" rx="9" fill="#0a0a14" stroke="#00f0ff" stroke-width="1"/>
        <text x="148" y="274" font-family="JetBrains Mono, monospace" font-size="7" fill="#00f0ff" text-anchor="middle">SCHEMA</text>

        <rect x="186" y="262" width="50" height="18" rx="9" fill="#0a0a14" stroke="#00f0ff" stroke-width="1"/>
        <text x="211" y="274" font-family="JetBrains Mono, monospace" font-size="7" fill="#00f0ff" text-anchor="middle">META</text>
    </g>

    <!-- Arrow up indicating ranking -->
    <g filter="url(#glow7)">
        <line x1="350" y1="240" x2="350" y2="120" stroke="#00ff9d" stroke-width="2" opacity="0.6"/>
        <polygon points="345,120 355,120 350,108" fill="#00ff9d"/>
        <text x="362" y="180" font-family="JetBrains Mono, monospace" font-size="8" fill="#00ff9d" font-weight="700" opacity="0.8">RANK</text>
        <text x="362" y="190" font-family="JetBrains Mono, monospace" font-size="8" fill="#00ff9d" font-weight="700" opacity="0.8">UP</text>
    </g>
</svg>
