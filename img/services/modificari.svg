<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Modificări și actualizări">
    <defs>
        <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0c1426"/>
            <stop offset="100%" stop-color="#0a0a14"/>
        </linearGradient>
        <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="400" height="300" fill="url(#bgGrad2)"/>
    <g opacity="0.06" stroke="#00f0ff" stroke-width="0.5">
        <line x1="0" y1="75" x2="400" y2="75"/>
        <line x1="0" y1="150" x2="400" y2="150"/>
        <line x1="0" y1="225" x2="400" y2="225"/>
        <line x1="100" y1="0" x2="100" y2="300"/>
        <line x1="200" y1="0" x2="200" y2="300"/>
        <line x1="300" y1="0" x2="300" y2="300"/>
    </g>

    <!-- Old version (left) -->
    <g filter="url(#glow2)">
        <rect x="40" y="80" width="140" height="100" rx="2" fill="#0a0a14" stroke="#00f0ff" stroke-width="1" opacity="0.6"/>
        <line x1="50" y1="100" x2="120" y2="100" stroke="#00f0ff" stroke-width="2" opacity="0.4"/>
        <line x1="50" y1="112" x2="100" y2="112" stroke="#7dd3fc" stroke-width="1" opacity="0.4"/>
        <line x1="50" y1="120" x2="110" y2="120" stroke="#7dd3fc" stroke-width="1" opacity="0.3"/>
        <rect x="50" y="135" width="60" height="30" fill="#00f0ff" opacity="0.1" stroke="#00f0ff" stroke-width="0.5"/>
        <line x1="50" y1="172" x2="105" y2="172" stroke="#7dd3fc" stroke-width="1" opacity="0.3"/>
        <text x="50" y="98" font-family="JetBrains Mono, monospace" font-size="6" fill="#7dd3fc" opacity="0.6">v1.0</text>
    </g>

    <!-- Arrow -->
    <g filter="url(#glow2)">
        <line x1="195" y1="130" x2="245" y2="130" stroke="#ff073a" stroke-width="2"/>
        <polygon points="245,124 245,136 258,130" fill="#ff073a"/>
        <text x="200" y="120" font-family="JetBrains Mono, monospace" font-size="8" fill="#ff073a" font-weight="700">UPGRADE</text>
    </g>

    <!-- New version (right) -->
    <g filter="url(#glow2)">
        <rect x="260" y="80" width="140" height="100" rx="2" fill="#0a0a14" stroke="#00f0ff" stroke-width="1.5"/>
        <rect x="260" y="80" width="140" height="14" fill="#00f0ff" opacity="0.15"/>
        <circle cx="270" cy="87" r="2" fill="#ff073a"/>
        <circle cx="278" cy="87" r="2" fill="#ff073a" opacity="0.6"/>
        <circle cx="286" cy="87" r="2" fill="#00ff9d"/>
        <rect x="325" y="84" width="40" height="6" rx="1" fill="#00f0ff" opacity="0.5"/>

        <!-- Header -->
        <rect x="270" y="102" width="60" height="6" rx="1" fill="#00f0ff"/>
        <line x1="270" y1="115" x2="350" y2="115" stroke="#7dd3fc" stroke-width="1" opacity="0.6"/>
        <line x1="270" y1="121" x2="320" y2="121" stroke="#7dd3fc" stroke-width="1" opacity="0.4"/>

        <!-- Image -->
        <rect x="270" y="130" width="60" height="38" fill="#00f0ff" opacity="0.15" stroke="#00f0ff" stroke-width="0.5"/>
        <circle cx="300" cy="149" r="6" fill="#00f0ff" opacity="0.5"/>
        <polygon points="297,145 297,153 304,149" fill="#00f0ff"/>

        <!-- Text block -->
        <rect x="334" y="130" width="60" height="3" rx="1" fill="#7dd3fc" opacity="0.7"/>
        <rect x="334" y="137" width="50" height="3" rx="1" fill="#7dd3fc" opacity="0.5"/>
        <rect x="334" y="144" width="55" height="3" rx="1" fill="#7dd3fc" opacity="0.5"/>
        <rect x="334" y="151" width="40" height="3" rx="1" fill="#7dd3fc" opacity="0.4"/>

        <!-- Bottom section -->
        <rect x="270" y="172" width="124" height="3" rx="1" fill="#7dd3fc" opacity="0.5"/>
        <text x="270" y="98" font-family="JetBrains Mono, monospace" font-size="6" fill="#00ff9d" opacity="0.9" font-weight="700">v2.0 ✓</text>
    </g>

    <!-- Code brackets floating -->
    <text x="50" y="50" font-family="JetBrains Mono, monospace" font-size="22" fill="#00f0ff" opacity="0.3" font-weight="700">{ }</text>
    <text x="320" y="40" font-family="JetBrains Mono, monospace" font-size="14" fill="#ff073a" opacity="0.4" font-weight="700">&lt;/&gt;</text>

    <!-- Decorative dots -->
    <circle cx="200" cy="220" r="3" fill="#00f0ff"/>
    <circle cx="200" cy="220" r="8" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.5"/>
    <circle cx="200" cy="220" r="14" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.25"/>

    <line x1="40" y1="240" x2="100" y2="240" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
    <line x1="300" y1="240" x2="360" y2="240" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
    <text x="40" y="262" font-family="JetBrains Mono, monospace" font-size="8" fill="#00f0ff" opacity="0.5">// redesign</text>
    <text x="298" y="262" font-family="JetBrains Mono, monospace" font-size="8" fill="#00f0ff" opacity="0.5">rebrand</text>
</svg>
