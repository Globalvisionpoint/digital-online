<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Securitate">
    <defs>
        <linearGradient id="bgGrad5" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0c1426"/>
            <stop offset="100%" stop-color="#0a0a14"/>
        </linearGradient>
        <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#00f0ff"/>
            <stop offset="100%" stop-color="#ff073a"/>
        </linearGradient>
        <filter id="glow5" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="400" height="300" fill="url(#bgGrad5)"/>
    <g opacity="0.06" stroke="#00f0ff" stroke-width="0.5">
        <line x1="0" y1="60" x2="400" y2="60"/>
        <line x1="0" y1="120" x2="400" y2="120"/>
        <line x1="0" y1="180" x2="400" y2="180"/>
        <line x1="0" y1="240" x2="400" y2="240"/>
    </g>

    <!-- Central shield -->
    <g filter="url(#glow5)">
        <path d="M 200 70 L 270 95 L 270 165 Q 270 215 200 245 Q 130 215 130 165 L 130 95 Z" fill="url(#shieldGrad)" opacity="0.85" stroke="#ffffff" stroke-width="1"/>
        <path d="M 200 70 L 270 95 L 270 165 Q 270 215 200 245 Q 130 215 130 165 L 130 95 Z" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="1"/>

        <!-- Inner highlight -->
        <path d="M 200 84 L 256 102 L 256 162 Q 256 202 200 226 Q 144 202 144 162 L 144 102 Z" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>

        <!-- Lock keyhole -->
        <circle cx="200" cy="140" r="14" fill="#0a0a14" stroke="#ffffff" stroke-width="1.5"/>
        <rect x="194" y="148" width="12" height="22" rx="2" fill="#0a0a14" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="200" cy="140" r="4" fill="#ffffff"/>
    </g>

    <!-- Floating security icons around shield -->
    <g filter="url(#glow5)">
        <!-- SSL cert - top left -->
        <g transform="translate(60, 60)">
            <rect x="-22" y="-16" width="44" height="32" rx="2" fill="#0a0a14" stroke="#00ff9d" stroke-width="1.5"/>
            <rect x="-22" y="-16" width="44" height="8" fill="#00ff9d" opacity="0.3"/>
            <text x="0" y="10" font-family="Orbitron, sans-serif" font-size="9" fill="#00ff9d" text-anchor="middle" font-weight="900">SSL</text>
        </g>

        <!-- Firewall - top right -->
        <g transform="translate(340, 60)">
            <rect x="-20" y="-15" width="40" height="30" rx="2" fill="#0a0a14" stroke="#ff073a" stroke-width="1.5"/>
            <line x1="-14" y1="-8" x2="14" y2="-8" stroke="#ff073a" stroke-width="1.5"/>
            <line x1="-14" y1="-2" x2="14" y2="-2" stroke="#ff073a" stroke-width="1.5"/>
            <line x1="-14" y1="4" x2="14" y2="4" stroke="#ff073a" stroke-width="1.5"/>
            <line x1="-14" y1="10" x2="14" y2="10" stroke="#ff073a" stroke-width="1.5"/>
            <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="6" fill="#ff073a" text-anchor="middle" opacity="0.7">FIREWALL</text>
        </g>

        <!-- Backup - bottom left -->
        <g transform="translate(60, 240)">
            <circle cx="0" cy="0" r="18" fill="#0a0a14" stroke="#00f0ff" stroke-width="1.5"/>
            <path d="M -8 -2 Q -8 -8 0 -8 Q 8 -8 8 -2 L 8 4 Q 8 8 4 8 L -4 8 Q -8 8 -8 4 Z" fill="none" stroke="#00f0ff" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="2" fill="#00f0ff"/>
        </g>

        <!-- Monitor - bottom right -->
        <g transform="translate(340, 240)">
            <rect x="-18" y="-12" width="36" height="22" rx="-2" fill="#0a0a14" stroke="#00f0ff" stroke-width="1.5"/>
            <line x1="-6" y1="14" x2="6" y2="14" stroke="#00f0ff" stroke-width="1.5"/>
            <line x1="-9" y1="10" x2="9" y2="10" stroke="#00f0ff" stroke-width="1.5"/>
            <polyline points="-8,-2 -2,4 4,-4 8,2" fill="none" stroke="#00ff9d" stroke-width="1.5"/>
        </g>
    </g>

    <!-- Connecting lines + pulse rings -->
    <g stroke="#00f0ff" stroke-width="0.5" opacity="0.3" stroke-dasharray="2,2">
        <line x1="80" y1="60" x2="140" y2="100"/>
        <line x1="320" y1="60" x2="260" y2="100"/>
        <line x1="80" y1="240" x2="140" y2="200"/>
        <line x1="320" y1="240" x2="260" y2="200"/>
    </g>

    <!-- Pulse rings around shield -->
    <circle cx="200" cy="150" r="120" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.2"/>
    <circle cx="200" cy="150" r="140" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.1"/>

    <!-- Bottom label -->
    <text x="200" y="285" font-family="JetBrains Mono, monospace" font-size="9" fill="#00f0ff" text-anchor="middle" opacity="0.7" font-weight="700">// SECURED · 256-bit</text>
</svg>
