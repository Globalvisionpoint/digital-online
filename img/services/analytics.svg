<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Google Analytics integrat">
    <defs>
        <linearGradient id="bgGrad9" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0c1426"/>
            <stop offset="100%" stop-color="#0a0a14"/>
        </linearGradient>
        <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
        </linearGradient>
        <filter id="glow9" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="400" height="300" fill="url(#bgGrad9)"/>
    <g opacity="0.06" stroke="#00f0ff" stroke-width="0.5">
        <line x1="0" y1="60" x2="400" y2="60"/>
        <line x1="0" y1="120" x2="400" y2="120"/>
        <line x1="0" y1="180" x2="400" y2="180"/>
        <line x1="0" y1="240" x2="400" y2="240"/>
    </g>

    <!-- Dashboard frame -->
    <g filter="url(#glow9)">
        <rect x="40" y="50" width="320" height="180" rx="3" fill="#0a0a14" stroke="#00f0ff" stroke-width="1.5"/>
        <rect x="40" y="50" width="320" height="22" fill="#0f0f1e" stroke="#00f0ff" stroke-width="1.5"/>
        <circle cx="54" cy="61" r="3" fill="#ff073a"/>
        <circle cx="64" cy="61" r="3" fill="#ff073a" opacity="0.6"/>
        <circle cx="74" cy="61" r="3" fill="#00ff9d"/>
        <text x="200" y="65" font-family="JetBrains Mono, monospace" font-size="9" fill="#00f0ff" text-anchor="middle" opacity="0.8">analytics.digital-online.ro</text>
    </g>

    <!-- Stat cards (top) -->
    <g filter="url(#glow9)">
        <rect x="55" y="84" width="92" height="48" rx="2" fill="#0c1426" stroke="#00f0ff" stroke-width="0.5"/>
        <text x="63" y="98" font-family="JetBrains Mono, monospace" font-size="7" fill="#7dd3fc">UTILIZATORI</text>
        <text x="63" y="122" font-family="Orbitron, sans-serif" font-size="16" fill="#00f0ff" font-weight="900">14.2K</text>
        <polyline points="115,118 120,114 125,116 130,110 135,108 140,104" fill="none" stroke="#00ff9d" stroke-width="1.5"/>

        <rect x="155" y="84" width="92" height="48" rx="2" fill="#0c1426" stroke="#00f0ff" stroke-width="0.5"/>
        <text x="163" y="98" font-family="JetBrains Mono, monospace" font-size="7" fill="#7dd3fc">CONVERSII</text>
        <text x="163" y="122" font-family="Orbitron, sans-serif" font-size="16" fill="#00f0ff" font-weight="900">6.04%</text>
        <text x="225" y="120" font-family="JetBrains Mono, monospace" font-size="9" fill="#00ff9d">↑12%</text>

        <rect x="255" y="84" width="92" height="48" rx="2" fill="#0c1426" stroke="#00f0ff" stroke-width="0.5"/>
        <text x="263" y="98" font-family="JetBrains Mono, monospace" font-size="7" fill="#7dd3fc">VENITURI</text>
        <text x="263" y="122" font-family="Orbitron, sans-serif" font-size="16" fill="#00f0ff" font-weight="900">€48K</text>
        <text x="325" y="120" font-family="JetBrains Mono, monospace" font-size="9" fill="#00ff9d">↑24%</text>
    </g>

    <!-- Main chart -->
    <g filter="url(#glow9)">
        <rect x="55" y="142" width="292" height="76" rx="2" fill="#0c1426" stroke="#00f0ff" stroke-width="0.5"/>
        <text x="63" y="156" font-family="JetBrains Mono, monospace" font-size="7" fill="#7dd3fc">TRAFIC 30 ZILE</text>

        <!-- Grid -->
        <g stroke="#00f0ff" stroke-width="0.3" opacity="0.2">
            <line x1="63" y1="170" x2="340" y2="170"/>
            <line x1="63" y1="185" x2="340" y2="185"/>
            <line x1="63" y1="200" x2="340" y2="200"/>
        </g>

        <!-- Area fill -->
        <path d="M 63 200 L 80 195 L 100 188 L 120 192 L 140 180 L 160 175 L 180 170 L 200 165 L 220 160 L 240 155 L 260 158 L 280 150 L 300 148 L 320 145 L 340 142 L 340 215 L 63 215 Z" fill="url(#chartGrad)"/>

        <!-- Line -->
        <path d="M 63 200 L 80 195 L 100 188 L 120 192 L 140 180 L 160 175 L 180 170 L 200 165 L 220 160 L 240 155 L 260 158 L 280 150 L 300 148 L 320 145 L 340 142" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>

        <!-- Data points -->
        <g fill="#00f0ff">
            <circle cx="140" cy="180" r="2.5"/>
            <circle cx="200" cy="165" r="2.5"/>
            <circle cx="260" cy="158" r="2.5"/>
            <circle cx="320" cy="145" r="2.5"/>
        </g>
        <!-- Last point highlight -->
        <circle cx="340" cy="142" r="4" fill="#ff073a"/>
        <circle cx="340" cy="142" r="8" fill="none" stroke="#ff073a" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- Data sources icons row -->
    <g filter="url(#glow9)">
        <rect x="60" y="248" width="50" height="32" rx="2" fill="#0a0a14" stroke="#00f0ff" stroke-width="1"/>
        <text x="85" y="269" font-family="JetBrains Mono, monospace" font-size="8" fill="#00f0ff" text-anchor="middle" font-weight="700">GA4</text>

        <rect x="120" y="248" width="50" height="32" rx="2" fill="#0a0a14" stroke="#00f0ff" stroke-width="1"/>
        <text x="145" y="269" font-family="JetBrains Mono, monospace" font-size="8" fill="#00f0ff" text-anchor="middle" font-weight="700">GSC</text>

        <rect x="180" y="248" width="50" height="32" rx="2" fill="#0a0a14" stroke="#00f0ff" stroke-width="1"/>
        <text x="205" y="269" font-family="JetBrains Mono, monospace" font-size="8" fill="#00f0ff" text-anchor="middle" font-weight="700">FB</text>

        <rect x="240" y="248" width="50" height="32" rx="2" fill="#0a0a14" stroke="#00f0ff" stroke-width="1"/>
        <text x="265" y="269" font-family="JetBrains Mono, monospace" font-size="8" fill="#00f0ff" text-anchor="middle" font-weight="700">GADS</text>

        <rect x="300" y="248" width="50" height="32" rx="2" fill="#0a0a14" stroke="#00f0ff" stroke-width="1"/>
        <text x="325" y="269" font-family="JetBrains Mono, monospace" font-size="8" fill="#00f0ff" text-anchor="middle" font-weight="700">SEO</text>
    </g>

    <!-- Live indicator -->
    <g filter="url(#glow9)">
        <circle cx="350" cy="55" r="3" fill="#00ff9d"/>
        <circle cx="350" cy="55" r="6" fill="none" stroke="#00ff9d" stroke-width="0.5" opacity="0.5"/>
    </g>
</svg>
