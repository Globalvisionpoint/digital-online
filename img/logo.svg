  <!-- Mark - 36x36 -->
  <g transform="translate(8, 2)" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 0 L 36 0 L 36 36 L 0 36 Z"/>
    <line x1="8" y1="9" x2="8" y2="27"/>
    <path d="M 8 9 L 19 9 A 9 9 0 0 1 19 27 L 8 27"/>
    <circle cx="25" cy="18" r="5" fill="none"/>
  </g>
  <!-- DIGITAL wordmark - mai sus -->
  <text x="56" y="16" font-family="'Instrument Serif','Times New Roman',serif" font-size="15" font-weight="400" fill="#ffffff" letter-spacing="-0.3">DIGITAL</text>
  <!-- ONLINE wordmark - mai jos, cu gap mai mare -->
